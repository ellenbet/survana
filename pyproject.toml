[project]
name = "survana"
version = "0.1.0"
authors = [
  { name="Ellen-Beate Tysvær"},
]
requires-python = ">= 3.11"
description = "Biomarker and survival analysis software for thesis."
readme = "README.md"
license = "AGPL-3.0-or-later"
dependencies = [
    "gradio>=6.5.1",
    "knockpy>=1.3.5",
    "matplotlib>=3.10.6",
    "mlflow>=3.3.2",
    "optuna>=4.5.0",
    "pandas>=2.3.2",
    "scikit-learn>=1.7.1",
    "scikit-survival>=0.25.0",
    "seaborn>=0.13.2",
    "tomli-w>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/ellenbet/survana"
[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"

[build-system]
requires = ["uv_build >= 0.10.10, <0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["src/survana/jupyter_explorations/**"]
wheel-exclude = ["src/survana/jupyter_explorations/**"]

[dependency-groups]
dev = [
  "ipykernel>=7.1.0",
  "pre-commit>=4.3.0",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocstrings-python>=1.19.0",
]
lint = [
  "mypy>=1.18.2",
  "pandas-stubs>=2.3.2.250827",
  "ruff>=0.13.3",
]
test = [
  "pytest>=9.0.0",
  "pytest-plt>=1.1.1",
  "pytest-skip-slow>=0.0.5",
]
